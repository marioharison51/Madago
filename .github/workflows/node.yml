name: Node.js CI

on:
  push:
    branches: [ main ]
    paths:
      - 'back-end/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'back-end/**'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: cd back-end && npm install

      - name: Run tests
        run: cd back-end && npm test || echo "No tests found"
