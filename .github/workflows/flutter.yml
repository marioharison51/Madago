name: Flutter CI

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend-flutter/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend-flutter/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate missing Android scaffolding if needed
        working-directory: frontend-flutter
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name madago --org com.marioharison51 .
          fi

      - name: Allow cleartext HTTP traffic and add INTERNET permission
        working-directory: frontend-flutter
        run: |
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/network_security_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <domain-config cleartextTrafficPermitted="true">
                  <domain includeSubdomains="true">127.0.0.1</domain>
                  <domain includeSubdomains="true">localhost</domain>
                  <domain includeSubdomains="true">10.0.2.2</domain>
              </domain-config>
          </network-security-config>
          EOF
          sed -i 's#<application#<application android:networkSecurityConfig="@xml/network_security_config" android:usesCleartextTraffic="true"#' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || \
          sed -i 's#<manifest[^>]*>#&\n    <uses-permission android:name="android.permission.INTERNET" />#' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        working-directory: frontend-flutter
        run: flutter pub get

      - name: Run tests
        working-directory: frontend-flutter
        run: flutter test || echo "No tests found"

      - name: Build APK (Android)
        working-directory: frontend-flutter
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: madago-apk
          path: frontend-flutter/build/app/outputs/flutter-apk/app-release.apk
